name: FleetSec Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write
  issues: write

defaults:
  run:
    working-directory: fleetsec-entregable01

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.104.0
      - run: semgrep scan --config rules/fleetsec.yml --error app tests

  tests-sca-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
           PYTHONPATH: ${{ github.workspace }}/fleetsec-entregable01
        run: pytest -q
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
          
      - name: Create reports directory
        run: mkdir -p reports
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: reports/sbom.json
          exit-code: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: fleetsec-sbom
          path: reports/sbom.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: [sast, tests-sca-sbom, secrets]
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned base image
        run: '! grep -qE "FROM .*:latest($|\\s)" Dockerfile'
      - run: docker build -t fleetsec-api:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fleetsec-api:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          soft_fail: true


